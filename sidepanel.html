<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Summary</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>Financial Summary</h1>
      </div>
      <div class="toolbar-actions">
        <button
          id="blur-values-toggle"
          class="icon-button secondary"
          type="button"
          aria-label="Blur values"
          aria-pressed="false"
          title="Blur values"
        >
          <span id="blur-values-icon" class="icon-svg-slot" aria-hidden="true"></span>
        </button>
        <button
          id="open-options"
          class="icon-button secondary"
          type="button"
          aria-label="Options"
          title="Options"
        >
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.13.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54c.58-.22 1.13-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
              fill="currentColor"
            />
          </svg>
        </button>
        <div class="run-menu">
          <button id="run-all" class="icon-button" aria-label="Run all" title="Run all">
            <span class="icon icon-play" aria-hidden="true"></span>
          </button>
          <button
            id="run-menu-toggle"
            class="run-menu-toggle icon-button"
            type="button"
            aria-label="Open run menu"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span class="icon icon-down" aria-hidden="true"></span>
          </button>
          <div id="run-menu-list" class="run-menu-list" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main>
      <div id="status" class="status"></div>
      <section id="global-summary" class="module-summary-grid global-summary"></section>
      <section id="modules" class="module-list"></section>
      <div id="stale-note" class="stale-note" hidden></div>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
