<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Summary</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>Financial Summary</h1>
      </div>
      <div class="toolbar-actions">
        <button id="open-options" class="secondary">Options</button>
        <div class="run-menu">
          <button id="run-all">Run</button>
          <button
            id="run-menu-toggle"
            class="run-menu-toggle"
            type="button"
            aria-label="Open run menu"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span aria-hidden="true">▾</span>
          </button>
          <div id="run-menu-list" class="run-menu-list" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main>
      <div id="status" class="status"></div>
      <section id="global-summary" class="module-summary-grid global-summary"></section>
      <section id="modules" class="module-list"></section>
      <div id="stale-note" class="stale-note" hidden></div>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
