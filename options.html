<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Institution Scraper Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Financial Institution Scraper Options</h1>
        <p>Set credentials and choose which fields each module should scrape.</p>
      </header>

      <div id="security-note" class="note">
        This scaffold stores credentials in extension local storage and restricts access to trusted extension contexts.
        Add passphrase-based encryption before using it for daily personal finance work.
      </div>

      <form id="options-form">
        <section id="modules"></section>
        <footer class="footer">
          <button type="submit">Save options</button>
          <span id="save-status"></span>
        </footer>
      </form>
    </main>

    <template id="module-template">
      <article class="module-card">
        <div class="module-header">
          <div>
            <h2 class="module-name"></h2>
            <p class="module-description"></p>
          </div>
          <label class="inline-toggle">
            <input class="module-enabled" type="checkbox">
            <span>Enabled</span>
          </label>
        </div>

        <div class="credentials-grid">
          <label>
            Username or email
            <input class="credential-username" type="text" autocomplete="off">
          </label>
          <label>
            Password
            <span class="password-field">
              <input class="credential-password" type="password" autocomplete="new-password">
              <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5c5.1 0 8.5 4.5 9.5 6.1a1.7 1.7 0 0 1 0 1.8C20.5 14.5 17.1 19 12 19s-8.5-4.5-9.5-6.1a1.7 1.7 0 0 1 0-1.8C3.5 9.5 6.9 5 12 5Zm0 2C7.9 7 5 10.5 4.3 12 5 13.5 7.9 17 12 17s7-3.5 7.7-5C19 10.5 16.1 7 12 7Zm0 2.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="currentColor"/>
                </svg>
                <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.3 2.3 21.7 20.7l-1.4 1.4-3-3A10.3 10.3 0 0 1 12 20c-5.1 0-8.5-4.5-9.5-6.1a1.7 1.7 0 0 1 0-1.8 17.2 17.2 0 0 1 4-4.3L1.9 3.7l1.4-1.4Zm4.7 7a15 15 0 0 0-3.7 3.7C5 14.5 7.9 18 12 18c1.5 0 2.8-.4 3.9-1.1l-2-2A3.5 3.5 0 0 1 8.1 9.3Zm3.1 3.1 1.5 1.5a1.5 1.5 0 0 1-1.5-1.5Zm.9-7.4c5.1 0 8.5 4.5 9.5 6.1a1.7 1.7 0 0 1 0 1.8 15.8 15.8 0 0 1-2.3 2.9l-1.4-1.4A13.3 13.3 0 0 0 19.7 12C19 10.5 16.1 7 12 7c-.9 0-1.7.2-2.5.4L7.9 5.8A10.7 10.7 0 0 1 12 5Zm3.4 6.9-4.3-4.3a3.5 3.5 0 0 1 4.3 4.3Z" fill="currentColor"/>
                </svg>
              </button>
            </span>
          </label>
        </div>

        <div class="extractor-list"></div>
      </article>
    </template>

    <template id="extractor-template">
      <div class="extractor-row">
        <label class="inline-toggle">
          <input class="extractor-enabled" type="checkbox">
          <span class="extractor-name"></span>
        </label>
        <label>
          Display label
          <input class="extractor-label" type="text">
        </label>
      </div>
    </template>

    <script type="module" src="options.js"></script>
  </body>
</html>
